# Calibration v2 sur TON ordinateur (runner auto-hébergé) : gratuit, aucune minute GitHub consommée.
# Prérequis : un runner auto-hébergé installé et lancé (Settings → Actions → Runners).
# Actions → calibrate-local → Run workflow. Le tableau final s'affiche dans le résumé du run.
# Les commandes sont compatibles Windows, macOS et Linux (pas de syntaxe bash).
name: calibrate-local

on:
  workflow_dispatch:
    inputs:
      workers:
        description: "Simulations en parallèle (auto = nombre de cœurs − 1)"
        default: "auto"
      smoke:
        description: "Test éclair (quelques minutes) au lieu de la calibration complète"
        type: boolean
        default: false

jobs:
  calibrate:
    runs-on: self-hosted
    timeout-minutes: 1440
    env:
      # Les données (≈ 330 Mo) sont gardées HORS du dépôt pour survivre d'un run à l'autre
      WORLDSIM_DATA: ${{ github.workspace }}/../worldsim-data
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[climate]"
      - run: python scripts/fetch_data.py --beyer
      - run: python scripts/calibrate_local.py ${{ inputs.workers != 'auto' && format('--workers {0}', inputs.workers) || '' }} ${{ inputs.smoke && '--smoke' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: calibration-locale-${{ github.run_number }}
          path: |
            sim/outputs/calibration_locale/calibration.md
            sim/outputs/calibration_locale/calibration.json
          retention-days: 90
