# Validation finale PRÉ-ENREGISTRÉE : 50 mondes neufs (seeds 1001–1050, jamais utilisées pour
# calibrer), réglage figé du scénario C. À lancer UNE SEULE FOIS. Le verdict s'affiche dans le
# résumé du run ; l'artifact contient aussi le monde 1001 avec ses images pour le viewer.
name: validate

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { chunk: 0, seeds: "1001,1002,1003,1004,1005" }
          - { chunk: 1, seeds: "1006,1007,1008,1009,1010" }
          - { chunk: 2, seeds: "1011,1012,1013,1014,1015" }
          - { chunk: 3, seeds: "1016,1017,1018,1019,1020" }
          - { chunk: 4, seeds: "1021,1022,1023,1024,1025" }
          - { chunk: 5, seeds: "1026,1027,1028,1029,1030" }
          - { chunk: 6, seeds: "1031,1032,1033,1034,1035" }
          - { chunk: 7, seeds: "1036,1037,1038,1039,1040" }
          - { chunk: 8, seeds: "1041,1042,1043,1044,1045" }
          - { chunk: 9, seeds: "1046,1047,1048,1049,1050" }
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: |
            sim/data/etopo10_ice_g_i2.*
            sim/data/ETOPO10_LICENSE
          key: etopo10-v1
      - uses: actions/cache@v4
        with:
          path: sim/data/Beyer2020_annual_vars_v1.2.2.nc
          key: beyer2020-annual-v1.2.2
      - run: pip install -e ".[climate]"
      # Même source climatique que la calibration (netCDF complet)
      - run: python scripts/fetch_data.py --beyer
      - name: Mondes ${{ matrix.seeds }}
        run: |
          python run_experiment_001.py --scenario C --climate beyer --seeds "${{ matrix.seeds }}" \
            ${{ matrix.chunk != 0 && '--no-frames' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: val-chunk-${{ matrix.chunk }}
          path: sim/outputs
          retention-days: 7

  verdict:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: val-chunk-*
          merge-multiple: true
          path: sim/outputs
      - run: python scripts/validate_final.py outputs
      - uses: actions/upload-artifact@v4
        with:
          name: validation-finale-${{ github.run_number }}
          path: |
            sim/outputs/validation_finale.md
            sim/outputs/validation_finale.json
            sim/outputs/ensemble_C_validation.json
            sim/outputs/C_beyer_seed1001
          retention-days: 90
