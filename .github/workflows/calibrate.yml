# Calibration honnête : une machine par variante de paramètres, plusieurs mondes par variante.
# Le classement se fait sur les régions d'entraînement ; les régions de test servent de contrôle.
# Actions → calibrate → Run workflow. Le tableau final s'affiche dans le résumé du run.
name: calibrate

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: "Mondes par variante"
        default: "6"
      climate:
        type: choice
        options: [beyer, parametric]
        default: beyer

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      seeds: ${{ steps.plan.outputs.seeds }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - id: plan
        working-directory: sim
        run: |
          echo "matrix=$(python -m worldsim.calibration plan)" >> "$GITHUB_OUTPUT"
          echo "seeds=$(python -c "print(','.join(str(i) for i in range(1, int('${{ inputs.seeds }}') + 1)))")" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: |
            sim/data/etopo10_ice_g_i2.*
            sim/data/ETOPO10_LICENSE
          key: etopo10-v1
      - if: inputs.climate == 'beyer'
        uses: actions/cache@v4
        with:
          path: sim/data/Beyer2020_annual_vars_v1.2.2.nc
          key: beyer2020-annual-v1.2.2
      - run: pip install -e ".[climate]"
      - run: python scripts/fetch_data.py ${{ inputs.climate == 'beyer' && '--beyer' || '' }}
      - name: Variante ${{ matrix.variant }}
        run: |
          python run_experiment_001.py --scenario B --climate ${{ inputs.climate }} --no-frames \
            --seeds "${{ needs.plan.outputs.seeds }}" --variant ${{ matrix.variant }} ${{ matrix.sets }}
      - uses: actions/upload-artifact@v4
        with:
          name: calib-${{ matrix.variant }}
          path: sim/outputs
          retention-days: 7

  report:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: calib-*
          merge-multiple: true
          path: sim/outputs
      - run: python -m worldsim.calibration report outputs
      - run: cat outputs/calibration.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: calibration-${{ inputs.climate }}-${{ github.run_number }}
          path: |
            sim/outputs/calibration.json
            sim/outputs/calibration.md
          retention-days: 90
