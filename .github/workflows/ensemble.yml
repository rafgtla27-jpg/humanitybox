# Lance un ENSEMBLE de simulations en parallèle (une seed = un monde) et en tire des distributions.
# Actions → ensemble → Run workflow. Résultat : artifact « ensemble-… » (JSON + graphique).
name: ensemble

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Scénario (A = monde vide, B = Eurasie habitée, C = avantage culturel émergent)"
        type: choice
        options: [A, B, C]
        default: C
      climate:
        description: "Climat"
        type: choice
        options: [beyer, parametric]
        default: beyer
      seeds:
        description: "Nombre de mondes (seeds 1..N)"
        default: "20"
      parallel:
        description: "Nombre de machines en parallèle"
        default: "5"
      publish:
        description: "Publier chaque run dans Supabase (ignoré sans secrets)"
        type: boolean
        default: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
    steps:
      - id: split
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          n, k = int("${{ inputs.seeds }}"), max(1, int("${{ inputs.parallel }}"))
          seeds = list(range(1, n + 1))
          chunks = [seeds[i::k] for i in range(k) if seeds[i::k]]
          print("matrix=" + json.dumps({"include": [{"chunk": i, "seeds": ",".join(map(str, c))} for i, c in enumerate(chunks)]}))
          PY

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: |
            sim/data/etopo10_ice_g_i2.*
            sim/data/ETOPO10_LICENSE
          key: etopo10-v1
      - if: inputs.climate == 'beyer'
        uses: actions/cache@v4
        with:
          path: sim/data/Beyer2020_annual_vars_v1.2.2.nc
          key: beyer2020-annual-v1.2.2
      - run: pip install -e ".[climate]"
      - run: python scripts/fetch_data.py ${{ inputs.climate == 'beyer' && '--beyer' || '' }}
      - name: Simulation (chunk ${{ matrix.chunk }} — seeds ${{ matrix.seeds }})
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python run_experiment_001.py --scenario ${{ inputs.scenario }} --climate ${{ inputs.climate }} \
            --seeds "${{ matrix.seeds }}" ${{ matrix.chunk != 0 && '--no-frames' || '' }} \
            ${{ inputs.publish && '--publish' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: ens-chunk-${{ matrix.chunk }}
          path: sim/outputs
          retention-days: 7

  aggregate:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: ens-chunk-*
          merge-multiple: true
          path: sim/outputs
      - run: python run_experiment_001.py --summary
      - run: python run_experiment_001.py --chart
      - uses: actions/upload-artifact@v4
        with:
          name: ensemble-${{ inputs.scenario }}-${{ inputs.climate }}-${{ github.run_number }}
          path: sim/outputs
          retention-days: 30
